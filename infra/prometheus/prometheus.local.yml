# Optional hybrid-dev Prometheus config when running uvicorn on the host machine
# Usage: mount this file instead of prometheus.yml if `api` is not running in Docker
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "praxisml_api"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics

  - job_name: "minio"
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
