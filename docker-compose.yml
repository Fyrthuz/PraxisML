services:
  # 1. Database
  db:
    image: pgvector/pgvector:pg15
    container_name: praxisml_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-praxisml_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-mlflow-db.sh:/docker-entrypoint-initdb.d/init-mlflow-db.sh:ro
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Cache & Message Broker
  redis:
    image: redis:7
    container_name: praxisml_redis
    ports:
      - "6379:6379"
    restart: always

  # 3. Experiment Tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.0
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_ENDPOINT_URL_S3=http://minio:9000
    depends_on:
      - minio
    command: >
      sh -c "pip install psycopg2-binary boto3 && mlflow server
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@db:5432/mlflow_db
      --default-artifact-root s3://praxisml/mlruns
      --serve-artifacts
      --host 0.0.0.0
      --port 5000"
    restart: always
  # 4. Object Storage — MinIO (self-hosted S3-compatible)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: praxisml_minio
    user: "0:0"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  # 4b. MinIO Initialization (creates default buckets via boto3)
  minio-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: praxisml_minio_init
    depends_on:
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_ENDPOINT=http://minio:9000
    command:
      - python
      - -c
      - |
        import os, time, boto3
        from botocore.exceptions import ClientError
        s3 = boto3.client("s3", endpoint_url=os.environ["MINIO_ENDPOINT"])
        for _ in range(30):
            try:
                s3.list_buckets()
                break
            except Exception:
                time.sleep(1)
        for bucket in ("praxisml", "praxisml-dvc"):
            try:
                s3.head_bucket(Bucket=bucket)
            except ClientError:
                s3.create_bucket(Bucket=bucket)
        print("MinIO buckets ready: praxisml, praxisml-dvc")
  # 5. FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: praxisml_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mlflow:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/praxisml_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL_S3=http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/MRI:/app/MRI
      - ./backend/models:/app/models
      - ./backend/data:/app/data
      - ./backend/migrations:/app/migrations
    restart: always

  # 6. Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: praxisml_worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/praxisml_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL_S3=http://minio:9000
    command: [ "uv", "run", "celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--pool=prefork", "--concurrency=2", "--queues=cpu-light,cpu-heavy,system-beat,gpu-train,celery" ]
    volumes:
      - ./backend/app:/app/app
      - ./backend/MRI:/app/MRI
      - ./backend/models:/app/models
      - ./backend/data:/app/data
      - ./backend/migrations:/app/migrations
    restart: always

  # 6a. Celery GPU Worker (opcional, perfil "gpu" — pool solo para CUDA seguro)
  gpu-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: praxisml_gpu_worker
    profiles: ["gpu"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/praxisml_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL_S3=http://minio:9000
    command: [ "uv", "run", "celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--pool=solo", "--concurrency=1", "--queues=gpu-train" ]
    volumes:
      - ./backend/app:/app/app
      - ./backend/models:/app/models
      - ./backend/data:/app/data
      - ./backend/migrations:/app/migrations
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped

  # 6b. Celery Beat — planificador de tareas periódicas
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: praxisml_celery_beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/praxisml_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command: [ "uv", "run", "celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info" ]
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    restart: always

  # 7. Frontend
  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    container_name: praxisml_frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    restart: always

  # 7b. vLLM — servidor LLM (OpenAI-compatible) para el asistente RAG (Fase 1)
  #     Opcional (profile "nlp"). Requiere GPU.
  vllm:
    image: vllm/vllm-openai:latest
    container_name: praxisml_vllm
    profiles: ["nlp"]
    depends_on:
      - api
    ports:
      - "8001:8001"
    environment:
      - VLLM_MODEL=${VLLM_MODEL_NAME:-Qwen/Qwen2.5-3B-Instruct}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    command: ["--model", "${VLLM_MODEL_NAME:-Qwen/Qwen2.5-3B-Instruct}", "--host", "0.0.0.0", "--port", "8001", "--max-model-len", "4096"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped

  # 8. Prometheus — scraping de métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: praxisml_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: always

  # 9. Grafana — dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: praxisml_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: always

  # 10. LocalStack Community — emulador AWS local (opcional, profile "aws-local")
  localstack:
    image: localstack/localstack:latest
    container_name: praxisml_localstack
    profiles: ["aws-local"]
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,iam,sts,sqs,sns,secretsmanager,ssm,kms,logs
      - DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
    volumes:
      - localstack_data:/var/lib/localstack
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  vllm_cache:
  localstack_data:
